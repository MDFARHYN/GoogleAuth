[package]
name = "google-authenticator"
version = "1.0.0"
description = "Google Authenticator Desktop with Material Design 3, QR Scanner, and Master Password Vault"
authors = ["Farhan"]
edition = "2024"

[lib]
name = "google_authenticator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2.8"
rqrr = "0.7"
rxing = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
url = "2.5"
percent-encoding = "2.3"
dirs = "6.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
